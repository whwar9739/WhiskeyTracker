services:
  postgres:
    image: postgres:16
    container_name: whiskeytracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: WhiskeyTrackerDb
      POSTGRES_USER: whiskeyuser
      POSTGRES_PASSWORD: whiskeypass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - whiskeytracker_net

  backend:
    build: ./backend
    container_name: whiskeytracker_backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=WhiskeyTrackerDb;Username=whiskeyuser;Password=whiskeypass
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - whiskeytracker_net

  frontend:
    build: ./frontend/whiskeytracker-frontend
    container_name: whiskeytracker_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - whiskeytracker_net

volumes:
  postgres_data:

networks:
  whiskeytracker_net:
    driver: bridge
